<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot password — Oak</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell">
    <nav id="nav"></nav>
    <header class="page-head">
      <h1>Forgot password</h1>
      <p>We’ll email a reset link if that address has an account.</p>
    </header>
    <div class="form-panel">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" />
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="btn" type="button">Send reset email</button>
      </div>
      <p id="msg"></p>
      <p class="form-foot"><a href="/login.html">Back to login</a></p>
    </div>
  </div>
  <script src="/app.js"></script>
  <script>
    Oak.renderNav("login");
    Oak.applyBootstrap();
    document.getElementById("btn").onclick = async () => {
      const msg = document.getElementById("msg");
      msg.className = "";
      msg.textContent = "…";
      try {
        const r = await Oak.api("/v1/auth/forgot-password", {
          method: "POST",
          body: JSON.stringify({ email: document.getElementById("email").value.trim() }),
        });
        msg.className = "ok";
        msg.textContent = r.message || "If that email exists, a reset link was sent.";
      } catch (e) {
        msg.className = "error";
        msg.textContent = Oak.friendlyError(e);
      }
    };
  </script>
</body>
</html>
