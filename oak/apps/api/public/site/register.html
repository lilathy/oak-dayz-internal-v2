<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register — Oak</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell">
    <nav id="nav"></nav>
    <header class="page-head">
      <h1>Register</h1>
      <p>Create an account, then redeem a key or buy a plan when checkout is live.</p>
    </header>
    <div class="form-panel">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" />
      </div>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+" required />
      </div>
      <div class="field">
        <label for="password">Password (min 10)</label>
        <input id="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required />
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="btn" type="button">Create account</button>
      </div>
      <p id="err" class="error"></p>
      <p class="form-foot">Already have an account? <a href="/login.html">Login</a></p>
    </div>
  </div>
  <script src="/app.js"></script>
  <script>
    Oak.renderNav("register");
    Oak.applyBootstrap();
    if (Oak.getToken()) location.href = "/account.html";
    document.getElementById("btn").onclick = async () => {
      document.getElementById("err").textContent = "";
      const email = document.getElementById("email").value.trim();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      if (password.length < 10) {
        document.getElementById("err").textContent = "Password must be at least 10 characters.";
        return;
      }
      if (username.length < 3 || !/^[a-zA-Z0-9_]+$/.test(username)) {
        document.getElementById("err").textContent = "Username: 3–32 chars, letters/numbers/_ only.";
        return;
      }
      try {
        const body = await Oak.api("/v1/auth/register", {
          method: "POST",
          body: JSON.stringify({ email, username, password }),
        });
        Oak.setToken(body.accessToken);
        Oak.saveUser(body.user);
        location.href = "/account.html";
      } catch (e) {
        document.getElementById("err").textContent = Oak.friendlyError(e);
      }
    };
  </script>
</body>
</html>
