<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password — Oak</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell">
    <nav id="nav"></nav>
    <header class="page-head">
      <h1>Reset password</h1>
      <p>Choose a new password (min 10 characters).</p>
    </header>
    <div class="form-panel">
      <div class="field">
        <label for="password">New password</label>
        <input id="password" type="password" minlength="10" autocomplete="new-password" />
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="btn" type="button">Update password</button>
      </div>
      <p id="msg"></p>
    </div>
  </div>
  <script src="/app.js"></script>
  <script>
    Oak.renderNav("login");
    Oak.applyBootstrap();
    const token = new URLSearchParams(location.search).get("token") || "";
    if (!token) {
      document.getElementById("msg").className = "error";
      document.getElementById("msg").textContent = "Missing reset token. Use the link from your email.";
    }
    document.getElementById("btn").onclick = async () => {
      const msg = document.getElementById("msg");
      msg.className = "";
      const password = document.getElementById("password").value;
      if (password.length < 10) {
        msg.className = "error";
        msg.textContent = "Password must be at least 10 characters.";
        return;
      }
      try {
        await Oak.api("/v1/auth/reset-password", {
          method: "POST",
          body: JSON.stringify({ token, password }),
        });
        msg.className = "ok";
        msg.textContent = "Password updated. You can log in now.";
        setTimeout(() => (location.href = "/login.html"), 1200);
      } catch (e) {
        msg.className = "error";
        msg.textContent = Oak.friendlyError(e);
      }
    };
  </script>
</body>
</html>
